# Recoil Link core deployment: bsctestnet (testnet)
# Deploy: rlink core deploy --chain bsctestnet --config configs/recoil-link/testnet/bsctestnet-core.yaml
#
# Owner and fee beneficiary: Recoil Labs treasury Safe (1-of-1 for now; add
# signers before mainnet, the address stays the same).
# Fee values follow typescript/sdk/src/consts/recoilLinkFees.ts. Exchange rates
# from ETH $2266.16 / BNB $704.56 / POL $0.0919 (CoinGecko, 2026-11-01), x1.3
# margin, 1e10 scale.
#
# Testnet pricing: Ethereum-testnet gas is priced low here (0.01-0.1 gwei) so a
# proof from BSC costs a fraction of a cent; at real prices it would cost ~$2.
# The price updater sets real values on mainnet.
#
# Gas oracle key: deployer wallet (testnet only; use a separate hot key on mainnet).
# Validator: one Recoil Link validator key signs for every testnet.
owner: '0x020BC752682191Fa9997B3307A8FC9710aeA3365'

# Messages are accepted when signed by the Recoil Link validator (1 of 1).
defaultIsm:
  type: messageIdMultisigIsm
  threshold: 1
  validators:
    - '0x9Fc49dA0660064Be72392fbDF9ed2bdF610969bB'

# Runs on every message; apps cannot bypass it. Fee is 0 at launch.
requiredHook:
  type: protocolFee
  owner: '0x020BC752682191Fa9997B3307A8FC9710aeA3365'
  beneficiary: '0x020BC752682191Fa9997B3307A8FC9710aeA3365'
  protocolFee: '0'
  maxProtocolFee: '1419325536505053' # ~0.00142 BNB (~$1), immutable

# Default for apps that don't set their own hook: record the message for
# validators (merkle tree) and collect prepaid destination gas (IGP).
defaultHook:
  type: aggregationHook
  hooks:
    - type: merkleTreeHook
    - type: interchainGasPaymaster
      owner: '0x020BC752682191Fa9997B3307A8FC9710aeA3365'
      beneficiary: '0x020BC752682191Fa9997B3307A8FC9710aeA3365'
      oracleKey: '0xfd446002b2979559ef4Cd06e5DCC84bbCC6b49D3'
      overhead:
        sepolia: 151966 # multisigIsmVerificationCost(1, 1)
        basesepolia: 151966 # multisigIsmVerificationCost(1, 1)
        optimismsepolia: 151966 # multisigIsmVerificationCost(1, 1)
        polygonamoy: 151966 # multisigIsmVerificationCost(1, 1)
      oracleConfig:
        sepolia:
          gasPrice: '100000000' # 0.1 gwei, testnet only (see header)
          tokenExchangeRate: '41813443851'
        basesepolia:
          gasPrice: '100000000' # 0.1 gwei, testnet only
          tokenExchangeRate: '41813443851'
        optimismsepolia:
          gasPrice: '10000000' # 0.01 gwei, testnet only
          tokenExchangeRate: '41813443851'
        polygonamoy:
          gasPrice: '60000000000' # 60 gwei; Amoy ~30 gwei
          tokenExchangeRate: '1695834'
